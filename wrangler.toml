# Cloudflare deployment configuration
# Docs: https://developers.cloudflare.com/workers/static-assets/

name = "neaglegolf-website"
compatibility_date = "2025-08-25"

# Static Assets deployment: serve ./dist as a static site on a Worker.
# Works with both:
#   - `npx wrangler deploy`            (Workers project — what the panel uses)
#   - `npx wrangler pages deploy dist` (Pages project)
[assets]
directory = "./dist"
not_found_handling = "404-page"

# Optional: redirect old SPA-style hash URLs to the new clean static URLs.
# Uncomment if you previously linked to #category/... / #detail/... anywhere.
# [[redirects]]
# from = "/#category/simulators"
# to = "/golf-simulators/"
# status = 301
#
# [[redirects]]
# from = "/#cases"
# to = "/case-studies/"
# status = 301
